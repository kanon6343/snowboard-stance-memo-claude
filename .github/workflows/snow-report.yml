# 雪山レポート（Claude 試作）: 毎時 snow/ を作り直してコミットする（予報の記録は 5・11・17・23時の枠ごとに1つ）。AI は使わない。
name: snow-report

on:
  schedule:
    - cron: "25 * * * *"   # 毎時25分（気象庁の正時の観測が出そろうのを待つ。GitHub の混雑で遅れたり飛ばされたりすることがある）
  workflow_dispatch: {}      # 手動でも動かせる

permissions:
  contents: write
  pages: write     # GITHUB_TOKEN での push では Pages が自動で作り直されないので、下で明示的に頼む

concurrency:
  group: snow-report
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 雪山レポートを作る
        run: python -B tools/yukiyama.py --out snow --back ../
      - name: 変わっていればコミット
        id: commit
        run: |
          git config user.name "snow-report-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snow
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "雪山レポートを更新 ($(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M'))"
            git pull --rebase
            git push
            echo "pushed=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Pages を作り直す（公開ページへ反映）
        if: steps.commit.outputs.pushed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
