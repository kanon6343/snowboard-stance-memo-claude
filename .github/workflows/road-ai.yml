# 道路の注意の「AI 版」（Claude 試作）。GitHub Actions のマシンの中で小さな AI（Ollama + Qwen2.5 3B）を動かす。
# 外部の AI サービス・API キーは使わない（GitHub Models は 2026/7/30 に終了）。公開リポジトリの Actions は無料。
# 入力は snow/latest.json のルール版の事実だけ。規制情報は扱わない。出力は snow/road_ai.json。
name: road-ai

on:
  schedule:
    - cron: "50 */3 * * *"   # 3時間ごと（雪山レポートの更新のあと）
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - tools/road_ai.py
      - .github/workflows/road-ai.yml

permissions:
  contents: write
  pages: write

concurrency:
  group: road-ai
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MODEL: qwen2.5:3b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: AI のモデルを前回から引き継ぐ（毎回ダウンロードしないため）
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-${{ env.MODEL }}-v1
      - name: Ollama を入れて起動
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama || true
          (OLLAMA_MODELS="$HOME/.ollama/models" ollama serve > /tmp/ollama.log 2>&1 &)
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:11434/api/tags > /dev/null && break; sleep 2; done
          OLLAMA_MODELS="$HOME/.ollama/models" ollama pull "$MODEL"
      - name: 道路の注意を AI で書く
        run: python -B tools/road_ai.py --data snow/latest.json --out snow/road_ai.json --model "$MODEL"
      - name: 変わっていればコミット
        id: commit
        run: |
          git config user.name "road-ai-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snow/road_ai.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "道路の注意（AI 版）を更新 ($(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M'))"
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
            echo "pushed=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Pages を作り直す
        if: steps.commit.outputs.pushed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
