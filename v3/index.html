<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>スタンスメモ v3</title>
  <meta name="description" content="スノーボードのスタンス・ビンディング・板の記録と、雪山の予報。Claude 版 v3（作り直し）。">
  <meta name="theme-color" content="#0b5a7a">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="スタンスメモ3">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="../icons/icon-claude-192.png" type="image/png">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon-claude.png">
  <link rel="stylesheet" href="app.css?v=3000">
  <script>
    // 色の設定は描画の前に当てる（ちらつき防止）
    try { const t = JSON.parse(localStorage.getItem('claude3:settings-v1') || '{}').theme; if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}
  </script>
  <script type="module" src="js/main.js?v=3000"></script>
</head>
<body>
  <a class="skip" href="#main">本文へ</a>
  <main id="main" tabindex="-1">
    <noscript><p class="noscript">このアプリは JavaScript を使います。</p></noscript>
  </main>
  <nav id="tabbar" class="tabbar" aria-label="画面の切り替え"></nav>
  <div id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
